# This component's whole release. A tag names a version, and the release carries
# everything a client needs to install this component on a MACHINE:
#
#   clutch-ssh-workspace.tar.gz  the artifact: this repo's tree, top level as its root
#   component.json               the declaration, as published (it also travels inside
#                                the tar; publishing it beside the manifest is what lets
#                                a client hand a host the declaration without the bytes)
#   clutch-component.json        the manifest naming both, with their sha256
#
# The HOST repo holds none of this. It stores one URL — this release's manifest —
# in ui/components.sources.json, and that is the entire coupling between the two
# (host's COMPONENTS.md §一). So this workflow owns the artifact's shape, the
# digest that pins it, and the version it declares: nothing here asks the host.
#
# Same shape as the other modules' workflows, with one difference that is worth
# knowing: this component is a PLUGIN (interface "plugin", runs_on "other"), so
# its release manifest must repeat `runs_on`. A packaged client has no checkout to
# ask, and a manifest that leaves it out is offered in the market and then refused
# on install — scripts/release-manifest.py treats that as a hard error, which is
# why the manifest step below cannot silently ship without it.
#
# `permissions: contents: write` is all a release needs — the run's own
# GITHUB_TOKEN may create one, no personal token and no third-party action.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The manifest's version comes from component.json, so the tag must agree
      # with it: a release whose tag says one thing and whose declaration says
      # another is not reproducible, and the manifest would be the lie.
      - name: The tag and the declaration name the same version
        run: |
          set -euo pipefail
          declared="$(python3 -c 'import json;print(json.load(open("component.json"))["version"])')"
          if [ "v$declared" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match component.json ${declared}" >&2
            exit 1
          fi

      # The suites that pin this plugin's behaviour live in the HOST repo
      # (tests/ssh-workspace.test.js against a fake bridge, tests/ssh-workspace-e2e.js
      # against the real clutch-workspace CLI) — they need the host tree, not this
      # one. What can be checked here is that nothing publishes a file Node cannot
      # even parse, and that the manifest writer still compiles.
      - name: Syntax
        run: |
          set -euo pipefail
          for f in index.js lib/exec.js lib/remote.js lib/settings.js; do
            node --check "$f"
          done
          python3 -m py_compile scripts/release-manifest.py

      # `git archive` of the tagged commit: members sit at the archive's TOP
      # level, because the install directory IS the component's own directory
      # (the host unpacking members elsewhere refuses the archive). Tracked files
      # only, so no staging leftovers can ride along.
      - name: The artifact
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=clutch-ssh-workspace.tar.gz HEAD
          # List it whole — NOT through `head`: `set -o pipefail` above turns the
          # SIGPIPE that `head` leaves behind (tar exits 141 once the reader is
          # gone) into a failed step, so a component with more members than the
          # reader asked for would fail its own release.
          tar -tzf clutch-ssh-workspace.tar.gz

      - name: The manifest
        run: |
          set -euo pipefail
          python3 scripts/release-manifest.py clutch-ssh-workspace.tar.gz component.json clutch-component.json
          cat clutch-component.json

      # `latest` in the host's source URL is GitHub's latest non-prerelease
      # release, which is exactly what this creates: a full release, not a draft,
      # not a pre-release. Publish it only when both digests are in hand.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            clutch-ssh-workspace.tar.gz component.json clutch-component.json
